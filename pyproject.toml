[project]
name = "apartment-association-platform"
version = "0.1.0"
description = "Self-hosted modular monolith for apartment associations: meters, alerts, community forum."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",  # Depends(scope="function") is required by src.core.database.DbSession
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "pyjwt>=2.9.0",
    "aiosmtplib>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "testcontainers[postgres]>=4.8.0",
    "aiosmtpd>=1.4.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Sets DEMO_MODE_ENABLED before importing the app settings.
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
# The local "alembic/" migrations folder must not make ruff treat the alembic package as ours.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection (mandated by docs/BACKEND_CONVENTIONS.md) uses calls as defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "src.core.security.require_building_roles",
]
