services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      ENVIRONMENT: local
      DEMO_MODE_ENABLED: "true"
      SEED_DEMO_DATA: "true"
      LOG_LEVEL: INFO
      # Traces, metrics and logs go to the collector, then to Grafana (docs/OBSERVABILITY.md).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Observability (Task 8): collector + Grafana LGTM (Tempo traces, Prometheus metrics, Loki logs).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - lgtm

  lgtm:
    image: grafana/otel-lgtm:0.8.1
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      # User-impact alert rule + webhook to the on-call agent (ops/alert-rules.yaml).
      - ./ops/alert-rules.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/alert-rules.yaml:ro

  # Receives the alert webhook, fetches the correlated error log from Loki and hands the incident
  # to the responder: a GitHub repository_dispatch when ONCALL_GITHUB_TOKEN is set, otherwise a
  # file in ./incidents (scripts/oncall_agent.py, docs/OBSERVABILITY.md).
  oncall-agent:
    image: python:3.12-slim
    command: ["python", "/agent/scripts/oncall_agent.py", "serve", "--incidents-dir", "/agent/incidents"]
    environment:
      LOKI_URL: http://lgtm:3100
      GITHUB_REPOSITORY: ${ONCALL_GITHUB_REPOSITORY:-Chemoday/ai-dev-zoomcamp-week-final}
      GITHUB_TOKEN: ${ONCALL_GITHUB_TOKEN:-}
    volumes:
      - ./scripts:/agent/scripts:ro
      - ./incidents:/agent/incidents
    depends_on:
      - lgtm

volumes:
  pgdata:
